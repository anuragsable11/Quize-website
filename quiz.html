<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play Quiz – Quiz Platform</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
    integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/quiz.css" />
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <header id="site-header"></header>

  <main class="quiz-main">
    <div class="quiz-container on-dark">
      <!-- Start Screen -->
      <div class="start-screen">
        <h1 class="screen-title">Set up your quiz</h1>
        <p id="greeting"></p>

        <div class="settings">
          <div class="row g-4">
            <!-- Number of Questions -->
            <div class="col-md-6 col-lg-3">
              <label for="num-questions" class="form-label">Number of Questions</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-list-ol"></i></span>
                <select id="num-questions" class="form-select">
                  <option value="5">5</option>
                  <option value="10">10</option>
                  <option value="15">15</option>
                  <option value="20">20</option>
                  <option value="30">30</option>
                  <option value="40">40</option>
                  <option value="50">50</option>
                </select>
              </div>
            </div>

            <!-- Select Category -->
            <div class="col-md-6 col-lg-3">
              <label for="category" class="form-label">Select Category</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-tags"></i></span>
                <select id="category" class="form-select">
                  <option value="">Any Category</option>
                  <option value="9">General Knowledge</option>
                  <option value="10">Books</option>
                  <option value="11">Films</option>
                  <option value="12">Music</option>
                  <option value="14">Television</option>
                  <option value="15">Video Games</option>
                  <option value="16">Board Games</option>
                  <option value="17">Science and Nature</option>
                  <option value="18">Computers</option>
                  <option value="19">Mathematics</option>
                  <option value="20">Mythology</option>
                  <option value="21">Sports</option>
                  <option value="22">Geography</option>
                  <option value="23">History</option>
                  <option value="24">Politics</option>
                  <option value="25">Art</option>
                  <option value="28">Vehicles</option>
                </select>
              </div>
            </div>

            <!-- Select Difficulty -->
            <div class="col-md-6 col-lg-3">
              <label for="difficulty" class="form-label">Select Difficulty</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-signal"></i></span>
                <select id="difficulty" class="form-select">
                  <option value="">Any Difficulty</option>
                  <option value="easy">Easy</option>
                  <option value="medium">Medium</option>
                  <option value="hard">Hard</option>
                </select>
              </div>
            </div>

            <!-- Time Per Question -->
            <div class="col-md-6 col-lg-3">
              <label for="time" class="form-label">Time Per Question</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-clock"></i></span>
                <select id="time" class="form-select">
                  <option value="10">10 seconds</option>
                  <option value="15">15 seconds</option>
                  <option value="20">20 seconds</option>
                  <option value="25">25 seconds</option>
                  <option value="30">30 seconds</option>
                  <option value="60">60 seconds</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <p id="start-message" class="alert alert-warning mt-3 mb-0 hide" role="alert"></p>

        <button class="quiz-btn start">Start Quiz</button>
        <div class="text-end mt-2">
          <a href="scorecard.html" class="btn btn-warning">📊 View Scorecard</a>
        </div>
      </div>

      <!-- Quiz Screen -->
      <div class="quiz hide">
        <div class="timer">
          <div class="progress">
            <div class="progress-bar"></div>
            <span class="progress-text"></span>
          </div>
        </div>
        <div class="question-wrapper">
          <div class="number"></div>
          <div class="question"></div>
        </div>
        <div class="answer-wrapper"></div>
        <button class="quiz-btn submit" disabled>Submit</button>
        <button class="quiz-btn next">Next</button>
      </div>

      <!-- End Screen -->
      <div class="end-screen hide">
        <h2 class="heading">Congratulations!</h2>
        <div class="score-card">
          <div class="score-summary">
            <div class="score-title">Your Score</div>
            <div class="score-value">
              <span class="final-score">0</span>
              <span class="total-score">/10</span>
            </div>
          </div>
          <div class="score-feedback">
            <span class="score-text">Great job!</span>
          </div>
        </div>
        <button class="quiz-btn restart">Restart Quiz</button>
        <div class="mt-3">
          <a href="scorecard.html" class="btn btn-warning">📊 View Scorecard</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    © 2026 AVA · Questions by the <a href="https://opentdb.com/" target="_blank" rel="noopener">Open Trivia Database</a>
  </footer>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/quiz.js"></script>
  <script src="assets/js/particles.js"></script>
</body>
</html>
