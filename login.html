<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in – Quizverse</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <meta name="theme-color" content="#1A237E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
    integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="auth-main">
    <div class="card auth-card">
      <img src="assets/img/logo.svg" class="auth-logo" alt="" width="64" height="64" />
      <h1 class="h3">Welcome back</h1>
      <form id="loginForm">
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="email" placeholder="Email Address" autocomplete="email" required />
          <label for="email">Email Address</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password" required />
          <label for="password">Password</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
        <div id="message" class="d-none" role="alert"></div>
      </form>
      <div class="auth-links">
        <p>New here? <a href="signup.html">Create an account</a></p>
        <p class="mb-0"><a href="quiz.html">Continue as a guest</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    © 2026 Quizverse · Questions by the <a href="https://opentdb.com/" target="_blank" rel="noopener">Open Trivia Database</a>
  </footer>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
