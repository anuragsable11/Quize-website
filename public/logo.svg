<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Quizverse">
  <title>Quizverse</title>
  <defs>
    <linearGradient id="qv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#qv-bg)"/>
  <!-- "Q": an orbit ring with a tail -->
  <circle cx="15" cy="15.5" r="7" fill="none" stroke="#fff" stroke-width="2.75"/>
  <path d="M19.4 20l4.1 4.1" fill="none" stroke="#fff" stroke-width="2.75" stroke-linecap="round"/>
  <!-- satellite -->
  <circle cx="23.6" cy="8.4" r="2.1" fill="#fff" fill-opacity="0.85"/>
</svg>
