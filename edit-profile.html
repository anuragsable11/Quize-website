<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f4f4f4;
      font-family: 'Poppins', sans-serif;
      padding: 40px;
    }
    .profile-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="container bg-white shadow p-5 rounded" style="max-width: 600px;">
    <h2 class="mb-4">Edit Profile</h2>

    <div class="text-center mb-4">
      <img id="previewImage" src="" class="profile-img mb-2" alt="Profile" />
      <div>
        <button id="deletePic" class="btn btn-outline-danger btn-sm">🗑️ Delete Photo</button>
      </div>
    </div>

    <form id="editProfileForm">
      <div class="mb-3">
        <label for="newUsername" class="form-label">Change Username</label>
        <input type="text" id="newUsername" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="newPic" class="form-label">Upload New Profile Photo</label>
        <input type="file" id="newPic" class="form-control" accept="image/*" />
      </div>
      <button type="submit" class="btn btn-primary">💾 Save Changes</button>
      <a href="scorecard.html" class="btn btn-secondary ms-2">Cancel</a>
    </form>
  </div>

  <script>
    const loggedInUser = localStorage.getItem("loggedInUser");
    const users = JSON.parse(localStorage.getItem("users")) || [];
    const user = users.find(u => u.name === loggedInUser);
    const previewImage = document.getElementById("previewImage");
    const deleteBtn = document.getElementById("deletePic");

    if (user && user.profileImage) {
      previewImage.src = user.profileImage;
    }

    document.getElementById("newUsername").value = user?.name || "";

    // Delete profile photo
    deleteBtn.addEventListener("click", () => {
      previewImage.src = "https://i.pravatar.cc/100";
      user.profileImage = "https://i.pravatar.cc/100";
      localStorage.setItem("loggedInProfile", user.profileImage);
    });

    // Save profile updates
    document.getElementById("editProfileForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const newName = document.getElementById("newUsername").value.trim();
      const newPic = document.getElementById("newPic").files[0];

      if (newPic) {
        const reader = new FileReader();
        reader.onload = () => {
          user.profileImage = reader.result;
          updateUser(user, newName);
        };
        reader.readAsDataURL(newPic);
      } else {
        updateUser(user, newName);
      }
    });

    function updateUser(user, newName) {
      user.name = newName;
      localStorage.setItem("loggedInUser", newName);
      localStorage.setItem("loggedInProfile", user.profileImage);

      // update in user list
      const index = users.findIndex(u => u.email === user.email);
      users[index] = user;
      localStorage.setItem("users", JSON.stringify(users));

      alert("Profile updated!");
      window.location.href = "scorecard.html";
    }
  </script>
</body>
</html>
