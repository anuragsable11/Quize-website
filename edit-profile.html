<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile – Quiz Platform</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
    integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/edit-profile.css" />
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="container py-4">
    <div class="card profile-card mx-auto">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 page-title mb-4">Edit Profile</h1>

        <div class="text-center mb-4">
          <img id="previewImage" src="" class="profile-img mb-2" alt="Profile" />
          <div>
            <button id="deletePic" type="button" class="btn btn-outline-danger btn-sm">🗑️ Delete Photo</button>
          </div>
        </div>

        <form id="editProfileForm">
          <div class="mb-3">
            <label for="newUsername" class="form-label">Username</label>
            <input type="text" id="newUsername" class="form-control" autocomplete="nickname" required />
          </div>
          <div class="mb-3">
            <label for="newPic" class="form-label">Profile photo</label>
            <input type="file" id="newPic" class="form-control" accept="image/*" />
          </div>
          <button type="submit" class="btn btn-brand">💾 Save Changes</button>
          <a href="scorecard.html" class="btn btn-secondary ms-2">Cancel</a>
        </form>

        <div id="message" class="d-none" role="alert"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    © 2026 AVA · Questions by the <a href="https://opentdb.com/" target="_blank" rel="noopener">Open Trivia Database</a>
  </footer>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/edit-profile.js"></script>
</body>
</html>
