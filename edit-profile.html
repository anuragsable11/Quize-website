<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/edit-profile.css" />
</head>
<body>
  <div class="container profile-card bg-white shadow p-5 rounded">
    <h2 class="mb-4">Edit Profile</h2>

    <div class="text-center mb-4">
      <img id="previewImage" src="" class="profile-img mb-2" alt="Profile" />
      <div>
        <button id="deletePic" type="button" class="btn btn-outline-danger btn-sm">🗑️ Delete Photo</button>
      </div>
    </div>

    <form id="editProfileForm">
      <div class="mb-3">
        <label for="newUsername" class="form-label">Change Username</label>
        <input type="text" id="newUsername" class="form-control" autocomplete="nickname" required />
      </div>
      <div class="mb-3">
        <label for="newPic" class="form-label">Upload New Profile Photo</label>
        <input type="file" id="newPic" class="form-control" accept="image/*" />
      </div>
      <button type="submit" class="btn btn-primary">💾 Save Changes</button>
      <a href="scorecard.html" class="btn btn-secondary ms-2">Cancel</a>
    </form>

    <div id="message" class="d-none" role="alert"></div>
  </div>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/edit-profile.js"></script>
</body>
</html>
