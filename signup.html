<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="signup.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-form">
      <h2 class="text-center">Sign Up</h2>
      <form id="signupForm">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="signup-name" placeholder="Full Name" required />
          <label for="signup-name">Full Name</label>
        </div>
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="signup-email" placeholder="Email Address" required />
          <label for="signup-email">Email Address</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="signup-password" placeholder="Password" required />
          <label for="signup-password">Password</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
      </form>
      <p class="mt-3 text-muted">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
