<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – Quiz Platform</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
    integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="auth-main">
    <div class="card auth-card">
      <h1 class="h3">Create your account</h1>
      <form id="signupForm">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="signup-name" placeholder="Full Name" autocomplete="name" required />
          <label for="signup-name">Full Name</label>
        </div>
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="signup-email" placeholder="Email Address" autocomplete="email" required />
          <label for="signup-email">Email Address</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="signup-password" placeholder="Password" autocomplete="new-password" minlength="6" required />
          <label for="signup-password">Password (at least 6 characters)</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        <div id="message" class="d-none" role="alert"></div>
      </form>
      <div class="auth-links">
        <p class="mb-0">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    © 2026 AVA · Questions by the <a href="https://opentdb.com/" target="_blank" rel="noopener">Open Trivia Database</a>
  </footer>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/signup.js"></script>
</body>
</html>
