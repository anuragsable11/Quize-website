<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scorecard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/scorecard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="layout d-flex">
    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column align-items-center text-center">
      <!-- Profile image with dropdown -->
      <div class="position-relative text-center">
        <img id="profileImage" src="https://i.pravatar.cc/100" class="profile-img mb-2" alt="Profile" />
        <h4 id="userName">Username</h4>
        <div id="profileMenu" class="position-absolute bg-white text-dark rounded shadow p-2" style="display:none;">
          <a id="profileMenuLink" href="edit-profile.html" class="d-block text-decoration-none text-dark">✏️ Edit Profile</a>
        </div>
      </div>

      <nav class="nav flex-column mt-4 w-100">
        <a class="nav-link" href="index.html">🎯 Play Quiz</a>
        <a class="nav-link" href="#scores">📊 Scorecard</a>
        <a class="nav-link" href="#improvement">📈 Improvement</a>
        <a id="logoutLink" class="nav-link text-danger" href="login.html">🚪 Logout</a>
      </nav>
    </div>

    <!-- Main content -->
    <div class="flex-grow-1 p-4">
      <h2 id="scores">📊 Your Scorecard</h2>
      <p id="stats" class="text-muted mb-2"></p>
      <div id="scoreList" class="mt-3"></div>

      <h3 id="improvement" class="mt-5">📈 Your Improvement</h3>
      <div class="chart-wrap">
        <canvas id="scoreChart"></canvas>
      </div>
    </div>
  </div>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/scorecard.js"></script>
</body>
</html>
