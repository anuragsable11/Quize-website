<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scorecard – Quizverse</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <meta name="theme-color" content="#1A237E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
    integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/scorecard.css" />
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="container py-4">
    <!-- Profile -->
    <div class="card mb-4">
      <div class="card-body d-flex align-items-center gap-3 flex-wrap">
        <img id="profileImage" src="https://i.pravatar.cc/100" class="profile-img" alt="Profile" />
        <div class="flex-grow-1">
          <h1 id="userName" class="h3 mb-1 page-title">Username</h1>
          <p id="userMeta" class="text-muted mb-0"></p>
        </div>
        <a id="profileAction" href="edit-profile.html" class="btn btn-brand">✏️ Edit Profile</a>
      </div>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4" id="stats">
      <div class="col-4">
        <div class="card stat-tile">
          <span class="stat-value" id="stat-attempts">0</span>
          <span class="stat-label">Attempts</span>
        </div>
      </div>
      <div class="col-4">
        <div class="card stat-tile">
          <span class="stat-value" id="stat-best">–</span>
          <span class="stat-label">Best score</span>
        </div>
      </div>
      <div class="col-4">
        <div class="card stat-tile">
          <span class="stat-value" id="stat-average">–</span>
          <span class="stat-label">Average</span>
        </div>
      </div>
    </div>

    <!-- Attempts -->
    <div class="card mb-4">
      <div class="card-body">
        <h2 id="scores" class="h4 mb-3">📊 Your attempts</h2>
        <div id="scoreList"></div>
      </div>
    </div>

    <!-- Chart -->
    <div class="card" id="chartCard">
      <div class="card-body">
        <h2 id="improvement" class="h4 mb-3">📈 Your improvement</h2>
        <div class="chart-wrap">
          <canvas id="scoreChart"></canvas>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    © 2026 Quizverse · Questions by the <a href="https://opentdb.com/" target="_blank" rel="noopener">Open Trivia Database</a>
  </footer>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/scorecard.js"></script>
</body>
</html>
