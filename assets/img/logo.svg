<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quizverse">
  <title>Quizverse</title>
  <defs>
    <linearGradient id="qv-planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C7CFF"/>
      <stop offset="1" stop-color="#B04DE8"/>
    </linearGradient>
    <!-- lower half of the ring's own frame: the part that passes in front of the planet -->
    <clipPath id="qv-front">
      <rect x="0" y="32" width="64" height="32"/>
    </clipPath>
  </defs>

  <g transform="rotate(-20 32 32)">
    <!-- orbit ring, back half (hidden behind the planet) -->
    <ellipse cx="32" cy="32" rx="29" ry="9" fill="none" stroke="#FF4081" stroke-width="3.5"/>
    <!-- planet -->
    <circle cx="32" cy="32" r="21" fill="url(#qv-planet)"/>
    <!-- orbit ring, front half -->
    <ellipse cx="32" cy="32" rx="29" ry="9" fill="none" stroke="#FF4081" stroke-width="3.5" clip-path="url(#qv-front)"/>
  </g>

  <!-- question mark -->
  <path d="M26.2 26.6a6 6 0 1 1 9.3 5c-2.2 1.4-3.5 2.7-3.5 5.2v1.2" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="44.3" r="2.7" fill="#fff"/>

  <!-- star -->
  <path d="M53 4.5l1.6 4.3 4.3 1.6-4.3 1.6-1.6 4.3-1.6-4.3-4.3-1.6 4.3-1.6z" fill="#FFD54F"/>
</svg>
