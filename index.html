<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
      integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Quiz App</title>
    <div class="form-text"></div>
    <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>
<link
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
  rel="stylesheet"
/>


  </head>

  
  
  <body>
    <canvas id="particle-canvas"></canvas>

    <div class="theme-container">
      <div class="toggle-theme">
        <label class="switch">
          <input type="checkbox" id="theme-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="bu">
      <!-- Home Button -->
      <a href="login.html" class="btn btn-outline-light">Home</a></div>
    <div class="container">
      <div class="start-screen">
        <div class="logo">
          <div class="icon">?</div>
          

          <div class="text"> Interactive Quiz Platform</div>
      </div>
      <body>
        <div id="greeting" style="color: white; font-size: 20px; margin-top: 10px;"></div>
        <div class="logo1">
            <span>AVA</span>
        </div>
        <div class="settings mt-4">
            <div class="row g-4">
              <!-- Number of Questions -->
              <div class="col-md-6 col-lg-3">
                <label for="num-questions" class="form-label">Number of Questions</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-list-ol"></i></span>
                  <select id="num-questions" class="form-select">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                    <option value="50">50</option>
                  </select>
                </div>
              </div>
          
              <!-- Select Category -->
              <div class="col-md-6 col-lg-3">
                <label for="category" class="form-label">Select Category</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-tags"></i></span>
                  <select id="category" class="form-select">
                    <option value="">Any Category</option>
                    <option value="9">General Knowledge</option>
                    <option value="10">Books</option>
                    <option value="11">Films</option>
                    <option value="12">Music</option>
                    <option value="14">Television</option>
                    <option value="15">Video Games</option>
                    <option value="16">Board Games</option>
                    <option value="17">Science and Nature</option>
                    <option value="18">Computers</option>
                    <option value="19">Mathematics</option>
                    <option value="20">Mythology</option>
                    <option value="21">Sports</option>
                    <option value="22">Geography</option>
                    <option value="23">History</option>
                    <option value="24">Politics</option>
                    <option value="25">Art</option>
                    <option value="28">Vehicles</option>
                  </select>
                </div>
              </div>
          
              <!-- Select Difficulty -->
              <div class="col-md-6 col-lg-3">
                <label for="difficulty" class="form-label">Select Difficulty</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-signal"></i></span>
                  <select id="difficulty" class="form-select">
                    <option value="">Any Difficulty</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                  </select>
                </div>
              </div>
          
              <!-- Time Per Question -->
              <div class="col-md-6 col-lg-3">
                <label for="time" class="form-label">Time Per Question</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-clock"></i></span>
                  <select id="time" class="form-select">
                    <option value="10">10 seconds</option>
                    <option value="15">15 seconds</option>
                    <option value="20">20 seconds</option>
                    <option value="25">25 seconds</option>
                    <option value="30">30 seconds</option>
                    <option value="60">60 seconds</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          
          
        <button class="btn start">Start Quiz</button>
        <div class="text-end mt-2">
          <a href="scorecard.html" class="btn btn-warning">📊 View Scorecard</a>
        </div>
        
      </div>
      <div class="quiz hide">
        <div class="timer">
          <div class="progress">
            <div class="progress-bar"></div>
            <span class="progress-text"></span>
          </div>
        </div>
        <div class="question-wrapper">
          <div class="number">
            Question <span class="current">1</span>
            <span class="total">/10</span>
          </div>
          <div class="question">This is a question This is a question?</div>
        </div>
        <div class="answer-wrapper">
          <div class="answer selected">
            <span class="text">answer</span>
            <span class="checkbox">
              <i class="fas fa-check"></i>
            </span>
          </div>
        </div>
        <button class="btn submit" disabled>Submit</button>
        <button class="btn next">Next</button>
      </div>
     <!-- End Screen (Scorecard) -->
<div class="end-screen hide">
  <h1 class="heading">Congratulations!</h1>
  <div class="score-card">
    <div class="score-summary">
      <div class="score-title">Your Score</div>
      <div class="score-value">
        <span class="final-score">0</span>
        <span class="total-score">/10</span>
      </div>
    </div>
    <div class="score-feedback">
      <span class="score-text">Great job!</span>
    </div>
  </div>
  <button class="btn restart">Restart Quiz</button>
</div>


    <script src="script.js"></script>
  </body>
</html>
